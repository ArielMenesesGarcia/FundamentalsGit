# .github/workflows/deploy.yml
name: Deploy Resources

on:
  workflow_dispatch:

jobs:
  deploy:
    uses: ./.github/workflows/azure-login.yml # Reutiliza login
    secrets: inherit # Hereda secretos

  create-resources:
    runs-on: ubuntu-latest
    needs: deploy
    steps:
      - name: Create Resource Group
        run: az group create --name rg-demo --location eastus

      - name: Create App Service Plan (Free)
        run: az appservice plan create --name plan-demo --resource-group rg-demo --sku F1 --is-linux

      - name: Create Web App
        run: az webapp create --name webapp-demo-ariel --resource-group rg-demo --plan plan-demo --runtime "DOTNET:8"
