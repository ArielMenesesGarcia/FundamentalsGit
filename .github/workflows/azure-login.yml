# .github/workflows/azure-login.yml
name: Azure Login + Function Setup

on:
  workflow_call:
  workflow_dispatch:

jobs:
  infra-setup:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Azure Login via OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Create Resource Group
        run: az group create --name rg-func-demo --location eastus

      - name: Create Storage Account
        run: |
          az storage account create \
              --name funcstorageari123456 \
              --resource-group rg-func-demo \
              --location eastus \
              --sku Standard_LRS

      - name: Create Function App (Consumption Plan)
        run: |
          az functionapp create \
            --name func-demo-ariel \
            --resource-group rg-func-demo \
            --consumption-plan-location eastus \
            --runtime dotnet \
            --functions-version 4 \
            --storage-account funcstorageari123456
